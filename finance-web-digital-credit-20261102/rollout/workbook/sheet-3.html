<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参数</title><style>body{margin:24px;font:15px/1.7 system-ui,sans-serif;color:#20372d;background:#fafcfb}a{color:#126453}h1{font-size:25px}h2{margin-top:30px;font-size:20px}table{border-collapse:collapse;font-size:13px}td,th{border:1px solid #dce5df;padding:8px;vertical-align:top;max-width:500px;overflow-wrap:anywhere}th{background:#edf4f0}pre{white-space:pre-wrap;overflow-wrap:anywhere}.scroll{overflow:auto;max-height:750px}.notice{padding:16px;background:#fff4de;border-left:3px solid #b68a2c}button{padding:5px 12px;margin:6px;cursor:pointer}iframe{width:100%;height:700px;border:1px solid #dce5df}</style></head><body><h1>参数</h1><p>实际模型交付，经评价端LibreOffice重算后的显示值。共4条数据；全部记录可翻页查看。</p><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button><input id="jump" type="number" value="1" min="1" style="width:65px" aria-label="页码"><button id="go">跳转</button><div class="scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><script id="data" type="application/json">[["参数", "数值", "性质"], ["基线", 0.7, "字典cluster_amplo：每类概率>=70%；否则Misto"], ["严格", 0.8, "作者敏感性假设，不是发布规则"], ["更严格", 0.9, "作者敏感性假设"], ["概率和容差", 1e-09, "作者数值容差"]]</script><script>const d=JSON.parse(document.getElementById("data").textContent),h=d.shift();let p=0;const size=25;function tr(v,t){let r=document.createElement("tr");for(let x of v){let c=document.createElement(t);c.textContent=x===null?"":x;r.append(c)}return r}document.getElementById("head").append(tr(["表内行",...h],"th"));function draw(){let b=document.getElementById("rows");b.replaceChildren();d.slice(p*size,p*size+size).forEach((v,i)=>b.append(tr([p*size+i+2,...v],"td")));document.getElementById("page").textContent=(p*size+1)+"–"+Math.min(p*size+size,d.length)+" / "+d.length;document.getElementById("prev").disabled=p===0;document.getElementById("next").disabled=(p+1)*size>=d.length;document.getElementById("jump").value=p+1}document.getElementById("prev").onclick=()=>{p--;draw()};document.getElementById("next").onclick=()=>{p++;draw()};document.getElementById("go").onclick=()=>{p=Math.max(0,Math.min(Math.ceil(d.length/size)-1,Number(document.getElementById("jump").value)-1));draw()};draw();</script></body></html>
