<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>使用说明</title><style>body{margin:24px;font:15px/1.7 system-ui,sans-serif;color:#20372d;background:#fafcfb}a{color:#126453}h1{font-size:25px}h2{margin-top:30px;font-size:20px}table{border-collapse:collapse;font-size:13px}td,th{border:1px solid #dce5df;padding:8px;vertical-align:top;max-width:500px;overflow-wrap:anywhere}th{background:#edf4f0}pre{white-space:pre-wrap;overflow-wrap:anywhere}.scroll{overflow:auto;max-height:750px}.notice{padding:16px;background:#fff4de;border-left:3px solid #b68a2c}button{padding:5px 12px;margin:6px;cursor:pointer}iframe{width:100%;height:700px;border:1px solid #dce5df}</style></head><body><h1>使用说明</h1><p>实际模型交付，经评价端LibreOffice重算后的显示值。共13条数据；全部记录可翻页查看。</p><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button><input id="jump" type="number" value="1" min="1" style="width:65px" aria-label="页码"><button id="go">跳转</button><div class="scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><script id="data" type="application/json">[["条目", "说明"], ["范围", "仅1000条历史匿名调查，163字段；非本机构客户，不作授信、定价、催收。全部统计未加权。"], ["文件读取", "两份.tab实际为逗号分隔UTF-8 CSV，按CSV读取；不按扩展名强行用制表符。字典163行，与数据字段一一对应。"], ["导航", "原始数据保留源顺序/字段/空白；Excel第2行=源第1条记录。id仅调查匿名ID。字典原文与问卷文本提供证据。"], ["重算", "参数B2为原定义70%，B3为作者80%，B4为作者90%；逐条复核含Excel公式，规模、迁移、指标检查链接公式。描述80为此次固定80%快照。"], ["边界", ">=包含等号；先检概率范围、和误差<=1e-9、并列；异常进未决而非删除。纯类仅稳定归属，不是质量或违约标签。"], ["原始字段", "P21为12个1/2二元编码题，问卷为RM多选；1按选中、2按未选操作性解读，有路由证据但缺正式值标签。计数是类型，不是实际合同数。"], ["空白", "原表空白保持空白；COUNTIF仅数明确1，不将空白写为零。P39全空331条单列为无可观察回答，不解释为无逾期。"], ["P39", "15列仅1/空白；字典每列说明截断且无选项名；PDF只有14个选项，不能按列序猜映射。P39_14、_15为特设敏感性剔除情景，不认定为不知道/没有。"], ["状态", "算术复现≠业务定义验证；详见证据与指标检查。不得把报价数作为贷款或转化。"], ["未稳定组", "保留Misto全量和未决组；80%下254人，其中原Misto145人+109人降为混合。不可把分母改为只剩纯类。"], ["描述表", "描述80是未加权快照；P40_3、P41_1的分母同时列全组人数及P42非空代理路由人数，后者不是已确认合格分母。"], ["重跑提示", "公式适用于当前1000行；追加数据需扩展引用范围。来源哈希在来源表，可比对原件。"], ["验证边界", "公式已用Python独立计算核对并写入显示缓存；LibreOffice因环境/proc未挂载未成功重算，未完成Office渲染检查。打开Excel后可重算。"]]</script><script>const d=JSON.parse(document.getElementById("data").textContent),h=d.shift();let p=0;const size=25;function tr(v,t){let r=document.createElement("tr");for(let x of v){let c=document.createElement(t);c.textContent=x===null?"":x;r.append(c)}return r}document.getElementById("head").append(tr(["表内行",...h],"th"));function draw(){let b=document.getElementById("rows");b.replaceChildren();d.slice(p*size,p*size+size).forEach((v,i)=>b.append(tr([p*size+i+2,...v],"td")));document.getElementById("page").textContent=(p*size+1)+"–"+Math.min(p*size+size,d.length)+" / "+d.length;document.getElementById("prev").disabled=p===0;document.getElementById("next").disabled=(p+1)*size>=d.length;document.getElementById("jump").value=p+1}document.getElementById("prev").onclick=()=>{p--;draw()};document.getElementById("next").onclick=()=>{p++;draw()};document.getElementById("go").onclick=()=>{p=Math.max(0,Math.min(Math.ceil(d.length/size)-1,Number(document.getElementById("jump").value)-1));draw()};draw();</script></body></html>
