<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>证据与未决</title><style>body{margin:24px;font:15px/1.7 system-ui,sans-serif;color:#20372d;background:#fafcfb}a{color:#126453}h1{font-size:25px}h2{margin-top:30px;font-size:20px}table{border-collapse:collapse;font-size:13px}td,th{border:1px solid #dce5df;padding:8px;vertical-align:top;max-width:500px;overflow-wrap:anywhere}th{background:#edf4f0}pre{white-space:pre-wrap;overflow-wrap:anywhere}.scroll{overflow:auto;max-height:750px}.notice{padding:16px;background:#fff4de;border-left:3px solid #b68a2c}button{padding:5px 12px;margin:6px;cursor:pointer}iframe{width:100%;height:700px;border:1px solid #dce5df}</style></head><body><h1>证据与未决</h1><p>实际模型交付，经评价端LibreOffice重算后的显示值。共8条数据；全部记录可翻页查看。</p><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button><input id="jump" type="number" value="1" min="1" style="width:65px" aria-label="页码"><button id="go">跳转</button><div class="scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><script id="data" type="application/json">[["证据号", "对象", "来源定位", "证据", "结论/待核实"], ["E1", "分群", "字典cluster / cluster_amplo", "潜在类别最大后验概率；基线>=70%，混合否则", "已验证标签算术；类别命名是发布者行为描述，不是风险等级。模型题项、拟合与样本外稳定性未提供。"], ["E2", "活动债务", "PDF p2 P21；字典P21_1…13；数据12列，缺_5", "P21问卷列12种借款+不知道；字典P21_11称信用卡，PDF称信用卡分期购买", "12项全有1/2，明确1合计1947；发布活动合计2115。832相等、168多1。最大12 vs13，不能假造缺项或把不知道算债务。需值标签、完整题项及派生代码。"], ["E3", "逾期账户", "PDF p3 P39；字典15列描述均截断", "PDF14个选项（含不知道、没有）；CSV15列，无逐列标签", "发布逾期数完全等于15列选中数；548人=1但可能含非债务选项。不能称669人逾期。需P39映射、特殊选项排除规则及计数代码。"], ["E4", "P39敏感性", "数据P39_14=29人、_15=278人", "剔除最后两列仅为作者压力测试，不推定其题意", "15列合计887次选择；1至13合计580次；发布数与敏感数在307条不同。不得覆盖原发布字段。"], ["E5", "路由", "PDF p2 P37写Todos；p3 P40/P41/P42至少一个P39选项", "P37仅669人非空，与发布活动>0一致；P42有效402人", "P42非空中40人P39全空、362人P39有选项；P39有选项的307人P42空。PDF路由与数据不能简单对齐，空白兼有未选/未展示/缺失。"], ["E6", "报价", "字典n_propostas_* / propostas_*_sim；PDF p1直接P8跳到P14", "PDF不含P12/P13及六渠道计数题；P20是产品报价有无而非渠道次数", "六渠道和与总数1000条一致；每渠道0至22、sim与>0一致。22可能是真实值或编码，未证实。无缩放、截尾或静默改码。收到报价非借款或转化。"], ["E7", "困难需求", "PDF p3 P40_3 / P41_1 / P41_3；字典明确选项", "均仅1/空白；多选，不能把百分比相加或用空白判无困难", "明确选中可支持“有此需求的调查信号”，不支持全群患率/因果；须先核路由与有效分母。"], ["E8", "覆盖与权重", "PDF p1年龄、P3终止与面板隐藏变量；数据", "问卷排除<=17、>=70、不贡献收入者；gender/state/sel由面板提取", "未提供概率样本框、招募率、权重或面板编码。样本日期为2025-07-09至24；PDF版本为6月6日，不能认定执行版本完全相同。"]]</script><script>const d=JSON.parse(document.getElementById("data").textContent),h=d.shift();let p=0;const size=25;function tr(v,t){let r=document.createElement("tr");for(let x of v){let c=document.createElement(t);c.textContent=x===null?"":x;r.append(c)}return r}document.getElementById("head").append(tr(["表内行",...h],"th"));function draw(){let b=document.getElementById("rows");b.replaceChildren();d.slice(p*size,p*size+size).forEach((v,i)=>b.append(tr([p*size+i+2,...v],"td")));document.getElementById("page").textContent=(p*size+1)+"–"+Math.min(p*size+size,d.length)+" / "+d.length;document.getElementById("prev").disabled=p===0;document.getElementById("next").disabled=(p+1)*size>=d.length;document.getElementById("jump").value=p+1}document.getElementById("prev").onclick=()=>{p--;draw()};document.getElementById("next").onclick=()=>{p++;draw()};document.getElementById("go").onclick=()=>{p=Math.max(0,Math.min(Math.ceil(d.length/size)-1,Number(document.getElementById("jump").value)-1));draw()};draw();</script></body></html>
