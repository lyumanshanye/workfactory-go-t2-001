<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大源原题与我的题目对比</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.7 system-ui,sans-serif;color:#222;letter-spacing:0;background:#fff}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:28px}h2{font-size:22px;border-top:1px solid #ccc;padding-top:22px}h3{font-size:18px}a{color:#176652;overflow-wrap:anywhere}nav{display:flex;gap:18px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,monospace}.scroll{overflow:auto;max-height:650px;border:1px solid #ccc}table{border-collapse:collapse;min-width:100%;font-size:13px}td,th{padding:6px 9px;border:1px solid #ddd;vertical-align:top;min-width:100px;max-width:500px;overflow-wrap:anywhere}th{background:#edf4f0;position:sticky;top:0}details{margin:14px 0}summary{cursor:pointer;font-weight:600}.status{padding:12px;border-left:4px solid #ad7023;background:#faf7ed}p{overflow-wrap:anywhere}iframe{width:100%;height:700px;border:1px solid #ccc}@media(max-width:600px){main{padding:16px}h1{font-size:24px}}</style></head><body><main><style>main{max-width:none;padding:16px}h1{font-size:24px;margin:0 0 12px}.domains{display:flex;gap:8px;margin-bottom:12px}.domains button{font:inherit;padding:6px 16px;cursor:pointer;background:white;border:1px solid #aaa;border-radius:4px}.domains button[aria-pressed=true]{background:#176652;color:white;border-color:#176652}.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.compare section{min-width:0}.compare h2{margin:0 0 8px;padding:0;border:0;font-size:20px}.compare iframe{width:100%;height:calc(100dvh - 155px);min-height:450px;border:1px solid #ddd}a{font-size:14px}h2 span{margin-left:12px;font-weight:400}@media(max-width:600px){main{padding:8px}.compare{gap:6px}.domains{gap:4px}.domains button{padding:5px 10px}.compare h2{font-size:16px}.compare h2 span{display:block;margin:0}}</style>
<h1>五领域题目对比</h1><nav class="domains" aria-label="领域"><button type="button" data-domain="GO" aria-pressed="true">GO</button><button type="button" data-domain="FIN" aria-pressed="false">FIN</button><button type="button" data-domain="LAW" aria-pressed="false">LAW</button><button type="button" data-domain="DA" aria-pressed="false">DA</button><button type="button" data-domain="GA" aria-pressed="false">GA</button></nav><div class="compare"><section><h2>大源原题<span><a id="left-link" href="dayuan-GO.html" target="_blank">单独打开</a></span></h2><iframe id="left" title="大源原题" src="dayuan-GO.html"></iframe></section><section><h2>我的<span><a id="right-link" href="task-GO.html" target="_blank">单独打开</a></span></h2><iframe id="right" title="我的题目" src="task-GO.html?v=task-only-2"></iframe></section></div>
<script>document.querySelectorAll('[data-domain]').forEach(button=>button.addEventListener('click',()=>{const d=button.dataset.domain;document.querySelectorAll('[data-domain]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const left=document.getElementById('left');left.removeAttribute('srcdoc');if(d==='GA'){left.srcdoc='<html lang="zh-CN"><meta charset="utf-8"><body style="font:16px/1.7 sans-serif;padding:20px">暂未找到大源已通过的游戏类原题。</body></html>';document.getElementById('left-link').hidden=true;}else{left.src='dayuan-'+d+'.html';document.getElementById('left-link').hidden=false;document.getElementById('left-link').href=left.src;}document.getElementById('right').src='task-'+d+'.html?v=task-only-2';document.getElementById('right-link').href='task-'+d+'.html';}));</script><script>document.querySelectorAll('.compare iframe').forEach(frame=>frame.addEventListener('load',()=>{try{frame.contentDocument.querySelectorAll('a[href]').forEach(link=>{const path=link.getAttribute('href').split('?')[0].split('#')[0];if(['index.html','comparison.html','fin-details.html'].includes(path)||/^task-|^dayuan-/.test(path)){link.target='_top';}});}catch(e){}}));</script></main></body></html>
